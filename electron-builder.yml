appId: org.thepearsonfamily.skipbo
productName: Skip-Bo
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.card-games
  target:
    - target: dmg
  identity: null
dmg:
  title: Skip-Bo
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
