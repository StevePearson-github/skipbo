appId: org.thepearsonfamily.skipbo
productName: Skip-Bo
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.card-games
  target:
    - target: dmg
    - target: zip
  identity: null
  artifactName: Skip-Bo-${version}-mac-${arch}.${ext}
dmg:
  title: Skip-Bo
win:
  target:
    - nsis
    - portable
nsis:
  artifactName: Skip-Bo-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Skip-Bo-${version}-windows-portable.${ext}
