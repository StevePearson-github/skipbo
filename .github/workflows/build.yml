name: build
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/e2e/game.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-windows
          path: test-results/
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: skipbo-windows-installer
          path: dist/Skip-Bo-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: skipbo-windows-portable
          path: dist/Skip-Bo-*-windows-portable.exe
  mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: skipbo-mac-dmg
          path: dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: skipbo-mac-standalone-zip
          path: dist/*.zip
